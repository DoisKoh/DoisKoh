name: Refresh AI charts

on:
  schedule:
    - cron: '17 22 * * *' # 06:17 Singapore time
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ai-charts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.9.3'
          python-version: '3.12'
      - name: Install workflow validator
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Check Python and workflow
        run: |
          actionlint_bin="$(go env GOPATH)/bin"
          export PATH="$actionlint_bin:$PATH"
          make check

  capture:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install browser
        run: |
          npm install --global agent-browser@0.26.0
          agent-browser install --with-deps
      - name: Export the intelligence and capability charts
        run: python3 scripts/refresh_chart.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-charts
          path: |
            assets/intelligence-vs-cost.png
            assets/capability-index-comparison.png
            assets/captured.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: capture
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ai-charts
          path: ${{ runner.temp }}/chart
      - name: Validate and publish the charts and capture metadata
        env:
          CHART_PATH: ${{ runner.temp }}/chart
        run: |
          python3 scripts/refresh_chart.py --publish "$CHART_PATH"
          git add -- assets/intelligence-vs-cost.png assets/capability-index-comparison.png assets/captured.json README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(profile): refresh AI charts'
          git push origin HEAD:main
